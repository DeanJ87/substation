name: ci

on:
  push:
    branches: [main, "poc-*"]
    paths-ignore: ["specs/**", "docs/**", "**/*.md"]  # docs-only pushes build and test nothing
  pull_request:
    paths-ignore: ["specs/**", "docs/**", "**/*.md"]  # docs-only pushes build and test nothing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no major-version tags after v7
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest
      - name: API contract matches the code
        run: |
          uv run python manage.py export_openapi ../frontend/src/api/openapi.json
          git diff --exit-code -- ../frontend/src/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run api:gen
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  repo-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Workflows (actionlint)
        uses: raven-actions/actionlint@v2
      - name: Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with: { recursive: true, dockerfile: "docker/*.Dockerfile", failure-threshold: error }
      - name: Shell scripts (shellcheck)
        run: shellcheck -S warning docker/entrypoint.sh backend/scripts/*.sh   # nas-prepare.sh is zsh

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend, repo-lint]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build images
        run: |
          for svc in frontend api worker; do
            docker buildx build --platform linux/amd64,linux/arm64 -f docker/$svc.Dockerfile -t substation-$svc:ci .
          done
