name: ci

on:
  push:
    branches: [main, "poc-*"]
    paths-ignore: ["specs/**", "docs/**", "**/*.md"]  # docs-only pushes build and test nothing
  pull_request:
    paths-ignore: ["specs/**", "docs/**", "**/*.md"]  # docs-only pushes build and test nothing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: substation, POSTGRES_PASSWORD: test, POSTGRES_DB: substation }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U substation" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUBSTATION_DATABASE_URL: postgres://substation:test@localhost:5432/substation
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no major-version tags after v7
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - name: Migrations match the models
        run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest
      - name: Dependencies have no known vulnerabilities (pip-audit)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"
      - name: API contract matches the code
        run: |
          uv run python manage.py export_openapi ../frontend/src/api/openapi.json
          git diff --exit-code -- ../frontend/src/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run api:gen
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Runtime dependencies have no high or critical advisories
        run: npm audit --omit=dev --audit-level=high

  repo-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Workflows (actionlint)
        uses: raven-actions/actionlint@v2
      - name: Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with: { recursive: true, dockerfile: "docker/*.Dockerfile", failure-threshold: error }
      - name: Shell scripts (shellcheck)
        run: shellcheck -S warning docker/entrypoint.sh backend/scripts/*.sh scripts/*.sh
      - name: Reference stack is valid Compose
        run: |
          SUBSTATION_DB_PASSWORD=x docker compose -f docker/compose.yml --env-file docker/.env.example config -q
          SUBSTATION_DOMAIN=x.example SUBSTATION_DB_PASSWORD=x docker compose -f docker/compose.yml \
            -f docker/compose.traefik.yml --env-file docker/.env.example config -q

  # 007-DR-27: the whole stack from this checkout, the header-only fixtures ingested, then axe on every screen in all
  # three themes and on the sub viewer
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the images
        run: |
          for svc in api frontend worker; do
            docker buildx build --load -f "docker/$svc.Dockerfile" -t "substation-$svc:ci" .
          done
      - name: Start the stack
        run: |
          mkdir -p /tmp/substation-ci/station /tmp/substation-ci/catalogues
          chmod 777 /tmp/substation-ci/station
          docker compose -f docker/compose.yml -f docker/compose.ci.yml --env-file docker/ci.env up -d --wait
      - name: Wait for the fixtures to be catalogued
        run: |
          for _ in $(seq 1 60); do
            n=$(docker compose -f docker/compose.yml -f docker/compose.ci.yml --env-file docker/ci.env exec -T api \
              python manage.py shell -c "from apps.catalogue.models import Dataset; print(Dataset.objects.count())" | tail -1)
            echo "datasets: $n"; [ "${n:-0}" -gt 0 ] && exit 0; sleep 5
          done
          exit 1
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Accessibility (axe, WCAG 2.2 AA)
        working-directory: frontend
        env: { SUBSTATION_E2E_URL: "http://localhost:8088" }
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/a11y.spec.ts
      - name: Stack logs
        if: failure()
        run: docker compose -f docker/compose.yml -f docker/compose.ci.yml --env-file docker/ci.env logs --tail 200

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend, repo-lint]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build images
        run: |
          for svc in frontend api worker; do
            docker buildx build --platform linux/amd64,linux/arm64 -f docker/$svc.Dockerfile -t substation-$svc:ci .
          done
