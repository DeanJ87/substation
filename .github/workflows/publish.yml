name: publish images
# Builds the api, worker and frontend images and pushes them to GHCR (private while the repo is), tagged with the branch, the short
# SHA and `latest` for the default branch. The NAS stack pulls ghcr.io/deanj87/substation-<svc>:<branch>.
on:
  push:
    branches: [main, "poc-*"]
    tags: ["v*"]  # releases: v1.4.2 publishes 1.4.2, 1.4 and latest (005-DR-26)
    paths-ignore: ["specs/**", "docs/**", "**/*.md"]  # docs-only pushes build and test nothing
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 005-DR-29: every check in ci.yml (lint, types, tests with coverage floors, audits, accessibility) gates the deploy
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc: [api, worker, frontend]  # the helper image builds in publish-helper.yml, only when it changes
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/deanj87/substation-${{ matrix.svc }}
          # 005-DR-26: a release (v1.4.2) → 1.4.2, 1.4, latest; a development build → edge and its branch;
          # every build → its short commit, which never moves. How and when to roll out is the operator's choice.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
            type=ref,event=branch
            type=sha,prefix=,format=short
      - id: ver
        run: |
          echo "v=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml) · ${GITHUB_REF_NAME} · ${GITHUB_SHA::7} · $(date -u '+%-d %b %Y %H:%M')" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          build-args: SUBSTATION_VERSION=${{ steps.ver.outputs.v }}
          context: .
          file: docker/${{ matrix.svc }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}
      # 005-DR-27: a published image has no critical vulnerability that already has a fix
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/deanj87/substation-${{ matrix.svc }}:${{ steps.ver.outputs.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"


  # 005-DR-26: the `edge` git branch follows the newest development commit whose images are all built, as the
  # `edge` image tag does. Anything that polls git (Portainer GitOps, Argo CD, Flux) follows `edge` and so never sees a
  # commit before its images exist. Releases are git tags, which only ever point at built commits too.
  edge-branch:
    needs: [ci, image]
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Move edge to this commit
        run: git push --force origin "${GITHUB_SHA}:refs/heads/edge"
