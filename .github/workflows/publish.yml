name: publish images
# Builds the api, worker and frontend images and pushes them to GHCR (private while the repo is), tagged with the branch, the short
# SHA and `latest` for the default branch. The NAS stack pulls ghcr.io/deanj87/substation-<svc>:<branch>.
on:
  push:
    branches: [main, "poc-*"]
    paths-ignore: ["specs/**", "docs/**", "**/*.md"]  # docs-only pushes build and test nothing
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc: [api, worker, frontend]  # the helper image builds in publish-helper.yml, only when it changes
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/deanj87/substation-${{ matrix.svc }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - id: ver
        run: echo "v=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml) · ${GITHUB_REF_NAME} · ${GITHUB_SHA::7} · $(date -u '+%-d %b %Y %H:%M')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          build-args: SUBSTATION_VERSION=${{ steps.ver.outputs.v }}
          context: .
          file: docker/${{ matrix.svc }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}

  # GitOps (005-DR-23): once every image is built, publish the deploy branch Portainer polls. It holds only the
  # compose file, with the images pinned to this commit, so Portainer never pulls a half-built release.
  deploy-branch:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Pin the images and push deploy/${{ github.ref_name }}
        env:
          BRANCH: deploy/${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_SHA::7}"
          out="$(mktemp -d)"
          mkdir -p "$out/docker"
          sed "s/\${SUBSTATION_TAG:-[^}]*}/${tag}/g" docker/compose.nas.yml > "$out/docker/compose.nas.yml"
          grep -q ":${tag}\$" "$out/docker/compose.nas.yml"
          printf 'Deploy branch for %s: written by CI from %s. Do not edit.\n' "${GITHUB_REF_NAME}" "${GITHUB_SHA}" > "$out/README.md"
          cd "$out"
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${tag}: ${GITHUB_REF_NAME}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
