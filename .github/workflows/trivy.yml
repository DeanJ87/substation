name: Trivy

# Dependency CVE, secret and Dockerfile misconfiguration scan of the repo.
# Fails on HIGH/CRITICAL findings that have a fix available.
# The nightly scan of running images (vulnscan hub) is separate and stays.

on:
  pull_request:
  push:
    branches: [poc-substation]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # per-job cache: runner instances on one VM share a home directory
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          cache: 'false'
